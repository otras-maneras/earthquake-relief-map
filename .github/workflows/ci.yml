name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: apps/web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET: ci-only-secret-not-used-in-production-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Crear esquema
        run: npm run db:push -- --force
      - run: npm run build
      # tsc va después del build: Next genera next-env.d.ts durante el build.
      - run: npx tsc --noEmit

  packages:
    name: ${{ matrix.package }} (typecheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [chat-bots, news-summarizer]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
