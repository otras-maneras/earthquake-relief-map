services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatbots
      POSTGRES_PASSWORD: chatbots
      POSTGRES_DB: chatbots
    ports:
      - "5433:5432"
    volumes:
      - chatbots_pg:/var/lib/postgresql/data

  app:
    build: .
    command: npm start
    env_file: .env
    environment:
      DATABASE_URL: postgres://chatbots:chatbots@db:5432/chatbots
    ports:
      - "3000:3000"
    depends_on:
      - db

  worker:
    build: .
    command: npm run worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://chatbots:chatbots@db:5432/chatbots
    depends_on:
      - db

volumes:
  chatbots_pg:
